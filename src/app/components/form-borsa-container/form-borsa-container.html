<form class="flex flex-col gap-4">
  <h2 class="sr-only">Dati per il calcolo</h2>
  @let form = stipendioForm();

  <!-- Sezione Dati Principali -->
  <fieldset class="bg-surface rounded-xl p-5 shadow-xs ring-1 ring-ring">
    <legend class="mb-4 font-mono text-xs/5 font-semibold tracking-widest uppercase text-muted">
      Dati Borsa di Studio
    </legend>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="flex flex-col gap-1">
        <label for="ral" class="text-sm text-muted flex items-center"
          >Importo Annuo Lordo *<app-info-tooltip
            tooltipId="ral-info"
            text="Importo annuo lordo della borsa di studio prima dei contributi INPS Gestione Separata."
          />
        </label>
        <input
          id="ral"
          type="number"
          [formField]="form.ral"
          placeholder="Es. 16243"
          aria-required="true"
          [attr.aria-invalid]="form.ral().invalid()"
          [attr.aria-describedby]="form.ral().invalid() ? 'ral-error' : null"
          class="px-3 py-2 rounded-lg border border-transparent bg-field text-fg shadow-xs ring-1 ring-ring-strong focus:outline-2 focus:-outline-offset-1 focus:outline-focus placeholder:text-faint aria-[invalid=true]:ring-danger aria-[invalid=true]:focus:outline-danger"
        />
        @if (form.ral().invalid()) {
          @for (error of form.ral().errors(); track error.kind) {
            <span id="ral-error" class="text-xs text-neg mt-1" role="alert">{{
              error.message
            }}</span>
          }
        }
      </div>

      <div class="flex flex-col gap-1">
        <label for="tipoContratto" class="text-sm text-muted flex items-center"
          >Tipo Contratto *<app-info-tooltip
            tooltipId="tipoContratto-info"
            text="Gli apprendisti hanno un'aliquota INPS ridotta (5,84%). I contratti a tempo determinato hanno una detrazione minima garantita inferiore."
          />
        </label>
        <select
          id="tipoContratto"
          [formField]="form.tipoContratto"
          aria-required="true"
          class="h-[42px] px-3 py-2 rounded-lg border border-transparent bg-field text-fg shadow-xs ring-1 ring-ring-strong focus:outline-2 focus:-outline-offset-1 focus:outline-focus"
        >
          @for (tipo of tipiContratto; track tipo.value) {
            <option [value]="tipo.value">{{ tipo.label }}</option>
          }
        </select>
      </div>

      <div class="flex flex-col gap-1">
        <label for="annoFiscale" class="text-sm text-muted flex items-center"
          >Anno Fiscale *<app-info-tooltip
            tooltipId="annoFiscale-info"
            text="Anno di riferimento per il calcolo."
          />
        </label>
        <select
          id="annoFiscale"
          [formField]="form.annoFiscale"
          aria-required="true"
          class="h-[42px] px-3 py-2 rounded-lg border border-transparent bg-field text-fg shadow-xs ring-1 ring-ring-strong focus:outline-2 focus:-outline-offset-1 focus:outline-focus"
        >
          @for (anno of anniFiscali; track anno) {
            <option [value]="anno">{{ anno }}</option>
          }
        </select>
      </div>
    </div>
  </fieldset>

  <!-- Sezione Opzioni Borsa di Studio -->
  <fieldset class="bg-surface rounded-xl p-5 shadow-xs ring-1 ring-ring">
    <legend class="mb-4 font-mono text-xs/5 font-semibold tracking-widest uppercase text-muted">
      Opzioni Borsa di Studio
    </legend>

    <div class="flex items-center gap-2">
      <input
        id="altraCoperturaPensionistica"
        type="checkbox"
        [formField]="form.altraCoperturaPensionistica"
        class="w-4 h-4 rounded border-ring-strong text-stone-600 focus:ring-focus focus:ring-offset-0 bg-field dark:checked:bg-stone-500"
      />
      <label for="altraCoperturaPensionistica" class="text-sm text-muted flex items-center"
        >Ho altra copertura pensionistica obbligatoria<app-info-tooltip
          tooltipId="altraCoperturaPensionistica-info"
          text="Se hai un'altra posizione previdenziale obbligatoria (es. iscrizione a una cassa professionale), l'aliquota INPS Gestione Separata si riduce dal 35,03% al 24%."
        />
      </label>
    </div>
  </fieldset>
</form>
