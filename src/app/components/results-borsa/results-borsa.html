<h2 class="sr-only">Risultati</h2>
@if (result(); as r) {
  <div class="flex flex-col gap-4">
    <app-tray
      [kpi]="kpi()"
      [ripartizione]="ripartizione()!"
      [aliquota]="r.aliquotaEffettiva"
      [stats]="stats()"
      oggetto="della borsa"
    />

    @if (r.borsaDiStudio; as borsa) {
      <div class="flex flex-col gap-2 tabular-nums">
        <app-ledger-card
          heading="Riepilogo borsa di studio"
          hue="ocra"
          icon="cap"
          [total]="r.nettoAnnuo"
        >
          <dl>
            <div appLedgerRow label="Importo lordo annuo" [amount]="borsa.importoLordo"></div>
            <div appLedgerRow label="IRPEF" value="Esente"></div>
            <div appLedgerRow label="Addizionali" value="Esenti"></div>
            <div appLedgerRow label="Netto annuo" [amount]="r.nettoAnnuo" level="total"></div>
            <div
              appLedgerRow
              label="Aliquota effettiva"
              [percent]="r.aliquotaEffettiva"
              level="detail"
            ></div>
          </dl>
        </app-ledger-card>

        <app-ledger-card
          heading="INPS Gestione Separata"
          hue="arancio"
          icon="shield"
          [total]="borsa.contributoGestioneSeparataBorsista"
          flow="out"
        >
          <dl>
            <div
              appLedgerRow
              label="Aliquota totale"
              [percent]="borsa.aliquotaGestioneSeparata"
            ></div>
            <div
              appLedgerRow
              label="Contributo totale"
              [amount]="borsa.contributoGestioneSeparataTotale"
            ></div>
            <div
              appLedgerRow
              label="A carico borsista (1/3)"
              [amount]="borsa.contributoGestioneSeparataBorsista"
              flow="out"
            ></div>
            <div
              appLedgerRow
              label="A carico ente (2/3)"
              [amount]="borsa.contributoGestioneSeparataEnte"
            ></div>
          </dl>
        </app-ledger-card>

        <app-ledger-card
          heading="Dettaglio mensile"
          hue="verde"
          icon="receipt"
          [total]="r.nettoMensile"
        >
          <dl>
            <div appLedgerRow label="Lordo mensile" [amount]="borsa.importoLordo / 12"></div>
            <div
              appLedgerRow
              label="GS borsista mensile"
              [amount]="borsa.contributoGestioneSeparataBorsista / 12"
              flow="out"
            ></div>
            <div appLedgerRow label="Netto mensile" [amount]="r.nettoMensile" level="total"></div>
          </dl>
        </app-ledger-card>

        <app-ledger-card
          heading="Costo per l'ente"
          hue="terracotta"
          icon="building"
          [total]="r.costoAziendale"
        >
          <dl>
            @for (voce of r.ripartizione.entrate; track voce.descrizione) {
              <div appLedgerRow [label]="voce.descrizione" [amount]="voce.importo"></div>
            }
          </dl>
        </app-ledger-card>
      </div>
    }
  </div>
} @else {
  <div
    class="rounded-[26px] bg-linear-145 from-g1 from-28% via-g2 via-70% to-g3 p-2 ring-1 ring-black/5 ring-inset dark:ring-white/10"
  >
    <div class="rounded-[19px] bg-surface p-8 text-center shadow-2xl">
      <p class="mb-2 text-muted">
        Compila il form per calcolare il netto della tua borsa di studio.
      </p>
      <p class="text-sm text-muted">Inserisci l'importo annuo lordo della borsa.</p>
    </div>
  </div>
}
